function unit(kind) {

    const idx = [[0, 1, 3, 2], [2, 3, 5, 4], [0, 4, 5, 1]]; // fondo, retro, pendenza (quad)

    g = new THREE.BufferGeometry();

}

      float gn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);

// --------------------------------------------------------------------------------------------
// caricamento scena
// --------------------------------------------------------------------------------------------
const PARTS = new Set(['Part', 'WedgePart', 'MeshPart', 'SpawnLocation', 'TrussPart', 'Seat']);

  switch (face) {
    case 'Front': return { n: [0, 0, -1], r: [-1, 0, 0], u: [0, 1, 0] };

  if (nam) { nam.renderOrder = 2; scene.add(nam); }

  if (am) { am.renderOrder = 2; scene.add(am); }
  const gm = glassB.mesh(new THREE.MeshStandardMaterial({ vertexColors: true, transparent: true, depthWrite: false, roughness: 0.08, metalness: 0.0, envMapIntensity: 1.4 }), { cast: false });
  if (gm) { gm.renderOrder = 3; scene.add(gm); }
}

      const id = idx(i, j, k);
      const on8 = Math.round(on * 255);
      if (isAir) { occ[id] = Math.min(occ[id], 255 - on8); wocc[id] = Math.min(wocc[id], 255 - on8); }
      else if (isWater) { if (on8 > wocc[id]) wocc[id] = on8; }
      else { if (on8 >= occ[id] || on >= 0.5) mat[id] = mi; if (on8 > occ[id]) occ[id] = on8; wocc[id] = Math.min(wocc[id], 255 - on8); }
    }
  }
  let filled = 0; for (let q = 0; q < total; q++) if (occ[q] > 127) filled++;
  console.log('terreno voxel pieni', filled);
  const matCols = matNames.map((n) => srgb(colors[n] || [0.5, 0.5, 0.5]));
  const wcol = srgb((T.props && T.props.WaterColor) || colors.Water || TERRAIN_COLORS_DEFAULT.Water);

  function march(field, colorFn, opts = {}) {
    const pos = [], nor = [], col = [];
    const cx = [0, 1, 1, 0, 0, 1, 1, 0], cy = [0, 0, 1, 1, 0, 0, 1, 1], cz = [0, 0, 0, 0, 1, 1, 1, 1];
    const E = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
    const val = new Float64Array(8), ids = new Int32Array(8);
    const vpos = new Array(12), vnor = new Array(12), vcol = new Array(12);
    const grad = (id, i, j, k) => {
      const f = (ii, jj, kk) => field[idx(Math.min(NX - 1, Math.max(0, ii)), Math.min(NY - 1, Math.max(0, jj)), Math.min(NZ - 1, Math.max(0, kk)))];
      return [(f(i - 1, j, k) - f(i + 1, j, k)) / 255, (f(i, j - 1, k) - f(i, j + 1, k)) / 255, (f(i, j, k - 1) - f(i, j, k + 1)) / 255];
    };
    for (let k = 0; k < NZ - 1; k++) for (let j = 0; j < NY - 1; j++) for (let i = 0; i < NX - 1; i++) {
      let ci = 0;
      for (let c = 0; c < 8; c++) { const id = idx(i + cx[c], j + cy[c], k + cz[c]); ids[c] = id; val[c] = field[id] / 255; if (val[c] >= 0.5) ci |= 1 << c; }
      if (ci === 0 || ci === 255) continue;
      const bits = edgeTable[ci];
      for (let e = 0; e < 12; e++) {
        if (!(bits & (1 << e))) continue;
        const a = E[e][0], b = E[e][1];
        const va = val[a], vb = val[b];
        const t = Math.abs(vb - va) < 1e-6 ? 0.5 : (0.5 - va) / (vb - va);
        const ai = i + cx[a], aj = j + cy[a], ak = k + cz[a], bi = i + cx[b], bj = j + cy[b], bk = k + cz[b];
        vpos[e] = [org[0] + (ai + (bi - ai) * t) * CELL, org[1] + (aj + (bj - aj) * t) * CELL, org[2] + (ak + (bk - ak) * t) * CELL];
        const ga = grad(ids[a], ai, aj, ak), gb = grad(ids[b], bi, bj, bk);
        const gx = ga[0] + (gb[0] - ga[0]) * t, gy = ga[1] + (gb[1] - ga[1]) * t, gz = ga[2] + (gb[2] - ga[2]) * t;
        const gl = Math.hypot(gx, gy, gz) || 1;
        vnor[e] = [gx / gl, gy / gl, gz / gl];
        vcol[e] = colorFn(va >= 0.5 ? ids[a] : ids[b], vpos[e]);
      }
      const base = ci << 4;
      for (let t = 0; triTable[base + t] !== -1; t += 3) {
        const e0 = triTable[base + t], e1 = triTable[base + t + 1], e2 = triTable[base + t + 2];
        // orientamento: la normale geometrica deve concordare con il gradiente
        const A = vpos[e0], Bv = vpos[e1], Cv = vpos[e2];
        const ux = Bv[0] - A[0], uy = Bv[1] - A[1], uz = Bv[2] - A[2], wx = Cv[0] - A[0], wy = Cv[1] - A[1], wz = Cv[2] - A[2];
        const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
        const avg = [(vnor[e0][0] + vnor[e1][0] + vnor[e2][0]), (vnor[e0][1] + vnor[e1][1] + vnor[e2][1]), (vnor[e0][2] + vnor[e1][2] + vnor[e2][2])];
        const order = (nx * avg[0] + ny * avg[1] + nz * avg[2] >= 0) ? [e0, e1, e2] : [e0, e2, e1];
        for (const e of order) { pos.push(...vpos[e]); nor.push(...vnor[e]); col.push(...vcol[e]); }
      }
    }
    return { pos, nor, col };
  }
  const solid = march(occ, (id, p) => {
    const m = mat[id]; const c = m ? matCols[m - 1] : new THREE.Color(0.5, 0.5, 0.5);
    const n = 0.88 + 0.24 * (vnoise(p[0] * 0.09, p[2] * 0.09) * 0.6 + vnoise(p[0] * 0.31 + 7, p[2] * 0.31 + 3) * 0.4) + 0.1 * vnoise(p[1] * 0.2 + p[0] * 0.05, p[2] * 0.05);
    return [c.r * n, c.g * n, c.b * n];
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(solid.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(solid.nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(solid.col, 3));
  const tm = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, envMapIntensity: 0.7 }));
  tm.castShadow = true; tm.receiveShadow = true; tm.frustumCulled = false; scene.add(tm);
  stats.terrainTris = solid.pos.length / 9;
  if (wocc.some((v) => v > 127)) {
    const w = march(wocc, () => [wcol.r, wcol.g, wcol.b]);
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute(w.pos, 3));
    wg.setAttribute('normal', new THREE.Float32BufferAttribute(w.nor, 3));
    wg.setAttribute('color', new THREE.Float32BufferAttribute(w.col, 3));
    const wm = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.1, metalness: 0.0, transparent: true, opacity: 0.8, envMapIntensity: 1.5 }));
    wm.renderOrder = 1; scene.add(wm);
  }
}

// --------------------------------------------------------------------------------------------
// cielo, luce, nebbia
// --------------------------------------------------------------------------------------------
function sunDirection(clock, lat, flip) {
  // modello della community: angolo orario H=(ora-6)*15 gradi, phi = latitudine - 23.5
  const H = (clock - 6) * 15 * Math.PI / 180;
  const phi = ((lat ?? 41.7) - 23.5) * Math.PI / 180;
  const d = new THREE.Vector3(Math.cos(H) * Math.cos(phi), Math.sin(H), Math.cos(H) * Math.sin(phi));
  if (flip) d.x = -d.x;
  return d.normalize();
}

function buildSky(light, effects) {
  const atm = effects.Atmosphere?.p || {};
  const col = (a, d) => srgb(a || d);
  const horizon = (window.PREVIEW?.horizon) ? srgb(window.PREVIEW.horizon) : col(atm.Color, [0.9, 0.7, 0.7]);
  const zenith = (window.PREVIEW?.zenith) ? srgb(window.PREVIEW.zenith) : new THREE.Color().copy(col(atm.Decay, [0.4, 0.3, 0.5])).multiplyScalar(0.6);
  const glow = (window.PREVIEW?.glow) ? srgb(window.PREVIEW.glow) : new THREE.Color(1.0, 0.55, 0.3);
  skyU = {
    uSun: { value: SUN.clone() }, uHor: { value: horizon }, uZen: { value: zenith }, uGlow: { value: glow },
    uCloud: { value: window.PREVIEW?.cloudCover ?? 0.45 }, uTime: { value: 0 },
  };
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: skyU,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }',
    fragmentShader: `
      varying vec3 vP; uniform vec3 uSun, uHor, uZen, uGlow; uniform float uCloud;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
      float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
      float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*n(p); p*=2.03; a*=.5; } return s; }
      void main(){
        vec3 d = normalize(vP);
        float y = d.y;
        float t = pow(clamp(y,0.,1.), 0.45);
        vec3 c = mix(uHor, uZen, t);
        float sd = max(dot(d, normalize(uSun)), 0.);
        c += uGlow * (pow(sd, 6.) * 0.55 + pow(sd, 40.) * 0.9);
        c += vec3(1.0,0.92,0.8) * pow(sd, 2200.) * 25.;
        // nuvole
        if (y > 0.02) {
          vec2 uv = d.xz / (y + 0.18) * 1.6;
          float c1 = fbm(uv * 1.2 + 3.1);
          float cl = smoothstep(1.0 - uCloud, 1.0 - uCloud + 0.28, c1);
          vec3 cc = mix(uHor * 1.15, vec3(1.0, 0.82, 0.78), 0.5) * (0.75 + 0.5 * pow(sd, 3.)) + uGlow * pow(sd, 4.) * 0.6;
          c = mix(c, cc, cl * smoothstep(0.02, 0.2, y) * 0.85);
        }
        if (y < 0.) c = mix(uHor, uHor * 0.7, clamp(-y * 4., 0., 1.));
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 48, 24), m);
  sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);
  return { horizon, zenith };
}

function setupLighting(lighting, terrainKids) {
  const L = lighting.p;
  const effects = {};
  for (const k of (lighting.k || [])) effects[k.c] = k;
  for (const k of (terrainKids || [])) effects[k.c] = k;
  const flip = window.PREVIEW?.flipSun ?? false;
  SUN = window.PREVIEW?.sunDir ? new THREE.Vector3(...window.PREVIEW.sunDir).normalize() : sunDirection(L.ClockTime ?? 14, L.GeographicLatitude ?? 41.7, flip);
  const { horizon } = buildSky(L, effects);
  const bright = L.Brightness ?? 2;
  const sunCol = (L.ColorShift_Top ? srgb(L.ColorShift_Top) : new THREE.Color(1, 1, 1)).lerp(new THREE.Color(1, 1, 1), 0.35);
  sunLight = new THREE.DirectionalLight(sunCol, window.PREVIEW?.sunIntensity ?? bright * 1.35);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(4096, 4096);
  sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.6;
  scene.add(sunLight, sunLight.target);
  const amb = L.Ambient ? srgb(L.Ambient) : new THREE.Color(0.4, 0.4, 0.4);
  const oamb = L.OutdoorAmbient ? srgb(L.OutdoorAmbient) : new THREE.Color(0.5, 0.5, 0.5);
  const hemi = new THREE.HemisphereLight(oamb.clone().lerp(new THREE.Color(1, 0.9, 0.95), 0.25), amb.clone().multiplyScalar(0.8), window.PREVIEW?.hemi ?? 1.15);
  scene.add(hemi);
  // ambiente IBL dal cielo
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); envScene.add(sky.clone());
  scene.environment = pm.fromScene(envScene, 0.02).texture;
  scene.environmentIntensity = window.PREVIEW?.envIntensity ?? 0.55;
  // nebbia
  const atm = effects.Atmosphere?.p;
  const dens = atm ? (atm.Density ?? 0.3) : 0.1;
  const fogCol = atm?.Color ? srgb(atm.Color).lerp(horizon, 0.5) : horizon;
  scene.fog = new THREE.FogExp2(fogCol, window.PREVIEW?.fog ?? (0.0005 + 0.0016 * dens));
  // bloom/colore
  const b = effects.BloomEffect?.p;
  if (b) { bloom.strength = window.PREVIEW?.bloom ?? 0.35; bloom.radius = 0.4; bloom.threshold = 1.0; }
  if (window.PREVIEW?.exposure) renderer.toneMappingExposure = window.PREVIEW.exposure;
}

function placeSun(center, extent) {
  sunLight.position.copy(center).addScaledVector(SUN, 1200);
  sunLight.target.position.copy(center);
  const s = sunLight.shadow.camera;
  s.left = -extent; s.right = extent; s.top = extent; s.bottom = -extent; s.near = 100; s.far = 3000;
  s.updateProjectionMatrix();
  sunLight.target.updateMatrixWorld();
}

// --------------------------------------------------------------------------------------------
// extra: manichini in scala (R15 ~ 5 stud), palla
// --------------------------------------------------------------------------------------------
function addDummy(pos, color, yaw = 0, s = 1) {
  const g = new THREE.Group();
  const mk = (sz, p, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(...sz), new THREE.MeshStandardMaterial({ color: srgb(c), roughness: 0.6 })); m.position.set(...p); m.castShadow = true; g.add(m); };
  const skin = [0.95, 0.8, 0.62];
  mk([0.9, 2, 1], [-0.5, 1.0, 0], [0.15, 0.15, 0.2]); mk([0.9, 2, 1], [0.5, 1.0, 0], [0.15, 0.15, 0.2]);
  mk([2, 2, 1], [0, 3.0, 0], color); mk([1, 2, 1], [-1.5, 3.0, 0], color); mk([1, 2, 1], [1.5, 3.0, 0], color);
  mk([1.2, 1.2, 1.2], [0, 4.6, 0], skin);
  g.position.set(...pos); g.rotation.y = yaw; g.scale.setScalar(s);
  scene.add(g);
}
function addBall(pos) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }));
  m.position.set(...pos); m.castShadow = true; scene.add(m);
}

// --------------------------------------------------------------------------------------------
// API per il renderer
// --------------------------------------------------------------------------------------------
window.loadScene = async (url, extras = {}) => {
  const data = await (await fetch(url)).json();
  setupLighting(data.lighting, data.terrain.kids);
  buildTerrain(data.terrain);
  buildParts(data.workspace);
  for (const d of (extras.dummies || [])) addDummy(d.pos, d.color || [0.9, 0.2, 0.2], d.yaw || 0, d.s || 1);
  for (const b of (extras.balls || [])) addBall(b);
  return { ...stats, sun: SUN.toArray().map((v) => +v.toFixed(3)) };
};
window.setView = (v) => {
  camera.fov = v.fov || 60; camera.aspect = W / H; camera.updateProjectionMatrix();
  camera.position.set(...v.pos); camera.lookAt(new THREE.Vector3(...v.target));
  const c = new THREE.Vector3(...(v.shadowCenter || v.target));
  placeSun(c, v.shadowExtent || 320);
  if (v.exposure) renderer.toneMappingExposure = v.exposure;
  if (v.fog !== undefined && scene.fog) scene.fog.density = v.fog;
  if (v.bloom !== undefined) bloom.strength = v.bloom;
  composer.render();
};
window.ready = true;
</script>
